<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SolSynth 用户注册</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 40px;
            width: 400px;
            max-width: 90vw;
        }
        h1 {
            color: #e94560;
            text-align: center;
            margin-bottom: 8px;
            font-size: 24px;
        }
        .subtitle {
            color: rgba(255,255,255,0.5);
            text-align: center;
            margin-bottom: 32px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            color: rgba(255,255,255,0.7);
            margin-bottom: 8px;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #e94560;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #e94560, #c23152);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 8px;
        }
        button:hover { opacity: 0.9; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #result {
            margin-top: 20px;
            padding: 14px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
            word-break: break-all;
        }
        #result.success {
            display: block;
            background: rgba(46, 213, 117, 0.15);
            border: 1px solid rgba(46, 213, 117, 0.4);
            color: #2ed573;
        }
        #result.error {
            display: block;
            background: rgba(255, 71, 87, 0.15);
            border: 1px solid rgba(255, 71, 87, 0.4);
            color: #ff4757;
        }
        .server-config {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .server-config label { font-size: 12px; }
        .server-config input { font-size: 13px; padding: 8px 12px; }
    </style>
</head>   
<body>
 <div class="container">
        <h1>🚀 SolSynth</h1>
        <p class="subtitle">用户注册</p>
        
        <div class="form-group">
            <label for="server">服务器地址</label>
            <input type="text" id="server" placeholder="http://103.79.185.53:5101" value="http://103.79.185.53:5101">
        </div>
        
        <div class="form-group">
            <label for="account">用户名</label>
            <input type="text" id="account" placeholder="请输入用户名">
        </div>
        
        <div class="form-group">
            <label for="password">密码</label>
            <input type="password" id="password" placeholder="请输入密码">
        </div>
        
        <button id="submitBtn" onclick="handleRegister()">注册</button>
        
        <div id="result"></div>
    </div>

    <script>
        async function handleRegister() {
            const server = document.getElementById('server').value.trim().replace(/\/$/, '');
            const account = document.getElementById('account').value.trim();
            const password = document.getElementById('password').value;
            const result = document.getElementById('result');
            const btn = document.getElementById
('submitBtn');            
            if (!account || !password) {
                result.className = 'error';
                result.textContent = '请填写用户名和密码';
                result.style.display = 'block';
                return;
            }
            
            btn.disabled = true;
            btn.textContent = '注册中...';
            result.style.display = 'none';
            
            try {
                const resp = await fetch(server + '/api/padlock/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ account, password })
                });
                
                const data = await resp.json();
                
                if (data.success) {
                    result.className = 'success';
                    result.textContent = '✅ ' + (data.data || '注册成功！');
                } else {
                    result.className = 'error';
                    result.textContent = '❌ ' + (data.error?.message || '注册失败');
                }
            } catch (e) {
                result.className = 'error';
                result.textContent = '❌ 网络连接失败: ' + e.message;
            }
            
            result.style.display = 'block';
            btn.disabled = false;
            btn.textContent = '注册';
        }
        
        // 回车提交
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('keypress', e => {
                if (e.key === 'Enter') handleRegister();
            });
        });
    </script>
</body>
</html>
