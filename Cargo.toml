[workspace]
resolver = "2"
members = [
    "crates/solsynth",
    "crates/solsynth-auth",
    "crates/solsynth-db",
    "crates/solsynth-grpc",
    "crates/solsynth-utils",
    "crates/solsynth-storage",
    "crates/solsynth-mail",
    "crates/solsynth-marketplace",
    "crates/solsynth-push",
    "crates/starfur-gateway",
    "crates/starfur-messager",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
authors = ["StarFurr"]
repository = "https://cnb.cool/starfurr/starfur"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Crypto
aes-gcm = "0.10"
hex = "0.4"
tokio-util = { version = "0.7", features = ["io"] }
mime_guess = "2"
rand = "0.8"

# Web framework
axum = { version = "0.8", features = ["macros", "multipart", "http2"] }
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "http2", "tokio"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "compression-full"] }

# gRPC
tonic = "0.12"
tonic-build = "0.12"
tokio-graceful = "0.2"

# Database
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-native-tls", "mysql", "macros", "migrate", "time", "uuid"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# UUID
uuid = { version = "1", features = ["v4", "v7", "serde"] }

# Auth
argon2 = { version = "0.5", features = ["std", "simple"] }
jsonwebtoken = "9"

# NATS
async-nats = "0.38"

# Redis
redis = { version = "0.27", features = ["tokio-comp", "json"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "cookies"] }

# Config
config = "0.14"

# Cache
moka = { version = "0.12", features = ["future"] }

# OpenTelemetry
opentelemetry = "0.28"
opentelemetry-otlp = "0.28"
opentelemetry-sdk = "0.28"
tracing-opentelemetry = "0.29"

# Other
futures = "0.3"

anyhow = "1"
async-trait = "0.1"
thiserror = "2"
regex = "1"
url = "2"
dashmap = "6"
dotenvy = "0.15"
lazy_static = "1"
sha2 = "0.10"

# Auth extensions
axum-extra = { version = "0.10", features = ["cookie", "cookie-signed"] }
base64 = "0.22"
webauthn-rs = { version = "0.5", features = ["private", "hyper"] }
webauthn-rs-proto = "0.5"
rcgen = "0.13"

# ORM
sea-orm = { version = "1.1", features = ["sqlx-mysql", "runtime-tokio-native-tls", "macros", "with-uuid", "with-chrono"] }
sea-orm-migration = "1.1"